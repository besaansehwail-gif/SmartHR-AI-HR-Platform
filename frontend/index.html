    <!--
      Plus Jakarta Sans carries no Arabic glyphs, so an Arabic UI would fall
      back to whatever the OS supplies (Tahoma on Windows) - legible, but not
      a typeface anyone chose. IBM Plex Sans Arabic is added for that: one
      extra family, four weights, matched in tone and x-height to the Latin
      face so the two do not read as two different products. It is applied by
      `[dir="rtl"]` / `:lang(ar)` in index.css, so an English session never
      downloads a glyph it will not draw.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
